<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <!-- HEADER -->
        <header>
            <h1>Layout Sederhana</h1>
        </header>

        <!-- NAVIGASI -->
        <nav>
            <a href="lab4_box.html" class="active">Home</a>
            <a href="artikel.html">Artikel</a>
            <a href="about.html">About</a>
            <a href="contact.html">Kontak</a>
        </nav>

        <!-- WRAPPER -->
        <section id="wrapper">
            <!-- SINGLE LAYOUT UNTUK FORM -->
            <section id="single-main">
                <h2 style="text-align: center; margin-bottom: 10px;">Hubungi Kami</h2>
                <p style="text-align: center; margin-bottom: 30px;">Silakan tinggalkan pesan melalui form di bawah ini.</p>
                
                <form action="#" method="post" class="contact-form">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap:</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda..." required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="pesan">Pesan (Message):</label>
                        <textarea id="pesan" name="pesan" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
                    </div>
                    
                    <div class="form-group" style="text-align: center;">
                        <button type="submit" class="btn btn-submit">Kirim Pesan</button>
                    </div>
                </form>
            </section>
        </section>

        <!-- FOOTER -->
        <footer>
            <p>&copy; 2021 - Universitas Pelita Bangsa</p>
        </footer>
    </div>
</body>
</html>
